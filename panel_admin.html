<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#12304B">
    <title>Gestor de solicitudes | Pañol</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=2026-10-26d">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js?v=2026-10-26d"></script>
</head>
<body>
<header class="appbar">
    <div class="appbar-inner">
        <a href="menu.html" class="appbar-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Menú</a>
        <div class="appbar-title"><h1>Gestor de solicitudes</h1><p>Pañol Electricidad y Automatización</p></div>
        
    </div>
</header>
<main class="page page-wide main-content">
    <div class="columns dashboard-container">
        <section class="column pending-requests">
            <h2>Por entregar</h2>
            <div id="pending-container"><p class="muted">Cargando solicitudes…</p></div>
        </section>
        <section class="column delivered-requests">
            <h2>Entregadas sin comentario</h2>
            <div id="delivered-container"><p class="muted">Cargando solicitudes…</p></div>
        </section>
    </div>
</main>

<div id="commentModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">Comentario de entrega <span class="close-btn" onclick="cerrarFormulario()" role="button" aria-label="Cerrar">×</span></div>
        <p class="muted">Solicitud <strong id="modalSolicitudId" class="num"></strong></p>
        <label for="modalComentario">Comentario</label>
        <textarea id="modalComentario" rows="5" placeholder="Ej: equipo completo, faltó calibrar, etc."></textarea>
        <div class="btn-row">
            <button class="btn-secondary" onclick="cerrarFormulario()">Cancelar</button>
            <button id="btnEnviarComentario">Guardar</button>
        </div>
        <p id="modalMsg" style="margin-top: 12px; text-align: center; font-weight: 600;"></p>
    </div>
</div>
<script>
    // CONFIGURACIÓN DE SUPABASE (SIN CAMBIOS)


    // Contenedores DOM (SIN CAMBIOS)
    const pendingContainer = document.getElementById('pending-container');
    const deliveredContainer = document.getElementById('delivered-container');

    // Variable global para almacenar el ID de la solicitud actual y el ID del intervalo (SIN CAMBIOS)
    let currentSolicitudId = null;
    let intervalId = null;

    // Función auxiliar para formatear fechas (SIN CAMBIOS)
    const formatDate = (dateString) => {
        if (!dateString) return 'N/A';
        const date = new Date(dateString);
        return date.toLocaleDateString('es-ES');
    };

    // --- LÓGICA DE INTERFAZ DEL MODAL (SIN CAMBIOS) ---

    window.abrirFormulario = (solicitudId) => {
        currentSolicitudId = solicitudId;
        document.getElementById('modalSolicitudId').textContent = 'S-' + solicitudId;
        document.getElementById('modalComentario').value = ''; // Limpiar textarea
        document.getElementById('modalMsg').textContent = ''; // Limpiar mensaje
        document.getElementById('commentModal').style.display = 'flex';
    };

    window.cerrarFormulario = () => {
        document.getElementById('commentModal').style.display = 'none';
    };

    // --- LÓGICA DE ACTUALIZACIÓN DE SUPABASE ---

    // Función para iniciar el refresco automático (SIN CAMBIOS)
    function startAutoRefresh() {
        const intervalTime = 5000;
        if (intervalId) {
            clearInterval(intervalId); // Asegura que solo hay un intervalo corriendo
        }
        intervalId = setInterval(loadDashboardData, intervalTime);
    }
    
    /**
     * Función principal para marcar como Entregado, incluyendo la actualización del Comentario.
     * Se usa para el modal (comentario manual) y el botón "Sin Comentarios".
     */
    async function actualizarComentario(solicitudId, comentario) {
        // Detener el refresco mientras actualizamos
        clearInterval(intervalId);
        document.body.style.cursor = 'wait';

        const isModalUpdate = document.getElementById('commentModal').style.display === 'flex';
        const msgElement = isModalUpdate ? document.getElementById('modalMsg') : null;

        if (msgElement) {
            msgElement.style.color = 'var(--ink)';
            msgElement.textContent = 'Guardando...';
        }

        const { error } = await supabaseClient
            .from('solicitudes')
            .update({
                estado: 'Entregado',
                fecha_entrega: new Date().toISOString(),
                comentario_entrega: comentario // <--- ACTIVA LA ACTUALIZACIÓN DE COMENTARIO
            })
            .eq('id', solicitudId);

        if (error) {
            console.error('Error al guardar comentario:', error);
            if (msgElement) {
                msgElement.style.color = 'var(--danger)';
                msgElement.textContent = '❌ Error al guardar: ' + error.message.substring(0, 50) + '...';
            } else {
                alert('Error al guardar: ' + error.message);
            }
            // Reanudar el refresco incluso con error
            document.body.style.cursor = 'default';
            startAutoRefresh();
            return false;
        }

        if (msgElement) {
            msgElement.style.color = 'var(--done)';
            msgElement.textContent = '✅ Solicitud actualizada con éxito.';
            setTimeout(cerrarFormulario, 1000); // Cerrar modal después de un segundo
        }

        // Recargar datos y reanudar el refresco
        await loadDashboardData();
        document.body.style.cursor = 'default';
        startAutoRefresh();
        return true;
    }


    /**
     * FUNCIÓN SIMPLE: Marcar Entregado de forma simple.
     */
    window.marcarEntregaSimple = async (solicitudId) => {
        // Detener el refresco mientras actualizamos
        clearInterval(intervalId);
        document.body.style.cursor = 'wait';

        const { error } = await supabaseClient
            .from('solicitudes')
            .update({
                estado: 'Entregado', // SOLO ESTADO
                fecha_entrega: new Date().toISOString() // Y FECHA
            })
            .eq('id', solicitudId);

        if (error) {
            console.error('Error al marcar como entregado:', error);
            alert('❌ Error al marcar como entregado: ' + error.message);
        } else {
            console.log(`✅ Solicitud S-${solicitudId} marcada como Entregada.`);
        }

        // Recargar datos y reanudar el refresco
        await loadDashboardData();
        document.body.style.cursor = 'default';
        startAutoRefresh();
        return true;
    };


    // Función al presionar "Enviar y Guardar" dentro del modal (SIN CAMBIOS)
    document.getElementById('btnEnviarComentario').onclick = () => {
        const comentario = document.getElementById('modalComentario').value.trim();
        if (!currentSolicitudId) {
            document.getElementById('modalMsg').style.color = 'var(--danger)';
            document.getElementById('modalMsg').textContent = '⚠️ Error: ID de solicitud no encontrado.';
            return;
        }
        if (!comentario) {
            document.getElementById('modalMsg').style.color = 'var(--pending)';
            document.getElementById('modalMsg').textContent = '⚠️ El comentario no puede estar vacío.';
            return;
        }
        actualizarComentario(currentSolicitudId, comentario);
    };

    // Función al presionar "Sin Comentario" en la tarjeta (guarda el marcador "Sin Comentarios")
    window.guardarSinComentario = async (solicitudId) => {
        if(confirm('¿Desea registrar "Sin Comentarios" para la Solicitud S-' + solicitudId + '?')) {
            // Llama a la función completa de actualización de comentarios
            // Una vez que se guarda "Sin Comentarios", la solicitud desaparecerá del panel.
            await actualizarComentario(solicitudId, "Sin Comentarios"); 
        }
    };
    

    // Función para crear el HTML de una tarjeta (Card)
    const createRequestCard = (solicitud) => {
        const isDelivered = solicitud.estado === 'Entregado';
        const statusClass = isDelivered ? 'card-status-delivered' : 'card-status-pending';
        
        const materiales = solicitud.materiales_solicitados || [];
        const usuarioNombre = solicitud.usuarios?.nombre || 'Desconocido';

        const materialListItems = materiales.map(m => `<li>${m.material} <span class="muted num">× ${m.cantidad}</span></li>`).join('');

        let html = `<div class="request-card" data-solicitud-id="${solicitud.id}">
                <div class="card-header">
                    <strong>S-${solicitud.id}</strong>
                    <span class="num">${formatDate(solicitud.fecha_solicitud)}</span>
                </div>
                <div class="card-detail"><label>Usuario:</label> ${usuarioNombre}</div>
                <div class="card-detail"><label>Docente:</label> ${solicitud.docente}</div>
                <div class="card-detail"><label>Asignatura:</label> ${solicitud.asignatura}</div>

                <div class="card-detail material-block">
                    <label>Materiales:</label>
                    <ul class="material-list">
                        ${materialListItems.length > 0 ? materialListItems : '<li>Sin materiales registrados.</li>'}
                    </ul>
                </div>

                <div class="card-detail"><label>Estado:</label> <span class="${statusClass}">${solicitud.estado ? solicitud.estado.toUpperCase() : 'N/A'}</span></div>`;

        if (isDelivered) {
            html += `<div class="card-detail"><label>Entrega:</label> ${formatDate(solicitud.fecha_entrega)}</div>
                    <div class="card-detail"><label>Comentario:</label> ${solicitud.comentario_entrega || 'N/A'}</div>`;

            // Lógica de botones para tarjetas Entregadas
            // Si la tarjeta está siendo mostrada aquí, es porque ya pasó el filtro de loadDashboardData,
            // lo que implica que el comentario está pendiente (null, "", o "N/A").
            const needsCommentAction = !solicitud.comentario_entrega || solicitud.comentario_entrega === 'Sin Comentarios' || solicitud.comentario_entrega === 'N/A';
            
            // Puesto que el filtro en loadDashboardData elimina los que dicen "Sin Comentarios", 
            // este bloque solo se ejecutará para tarjetas que requieren acción.
            if (needsCommentAction) {
                html += `<div class="actions">
                            <button class="btn-comment" onclick="abrirFormulario(${solicitud.id})">Agregar comentario</button>
                            <button class="btn-no-comment btn-secondary" onclick="guardarSinComentario(${solicitud.id})">Sin comentario</button>
                        </div>`;
            } 
            // La cláusula 'else' anterior (que mostraba "Comentario registrado") ya no es necesaria 
            // porque si tiene un comentario, ya fue filtrada y no llega hasta aquí.

        } else {
            // Lógica de botones para tarjetas Pendientes (SOLO 1 botón)
            html += `<div class="actions">
                        <button class="btn-success" onclick="marcarEntregaSimple(${solicitud.id})">Marcar como entregado</button>
                    </div>`; 
        }

        html += '</div>';
        return html;
    };

    // Función: Actualiza el contenedor agregando/quitando/reemplazando tarjetas de forma eficiente. (SIN CAMBIOS)
    function updateContainerDynamically(container, newSolicitudes, emptyMessage) {
        const newIds = newSolicitudes.map(s => String(s.id));

        // 1. ELIMINAR tarjetas viejas
        Array.from(container.children).forEach(card => {
            const cardId = card.dataset.solicitudId;
            if (cardId && !newIds.includes(cardId)) {
                card.remove();
            }
        });

        // 2. AGREGAR/REEMPLAZAR tarjetas
        newSolicitudes.forEach(solicitud => {
            const solicitudIdStr = String(solicitud.id);
            let cardElement = container.querySelector(`[data-solicitud-id="${solicitudIdStr}"]`);

            // Generar el nuevo HTML de la tarjeta
            const cardHtml = createRequestCard(solicitud);
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = cardHtml.trim();
            const newCardElement = tempDiv.firstChild;
            newCardElement.dataset.solicitudId = solicitudIdStr;

            if (cardElement) {
                // Reemplazar el elemento completo (asegura la actualización de los botones)
                cardElement.replaceWith(newCardElement);
            } else {
                // Si no existe, añadir la nueva tarjeta al inicio
                container.prepend(newCardElement);
            }
        });

        // 3. MENSAJE DE VACÍO
        const hasCards = container.querySelector('[data-solicitud-id]') !== null;

        if (newSolicitudes.length === 0 && !hasCards) {
             container.innerHTML = `<p class="empty-state">${emptyMessage}</p>`;
        } else if (hasCards) {
            // Eliminar el mensaje de vacío si existen tarjetas
            const emptyP = container.querySelector('p');
            if (emptyP && !emptyP.dataset.solicitudId) {
                emptyP.remove();
            }
        }
    }

    async function loadDashboardData() {
        // La consulta clave: pide todos los datos de las solicitudes, más los materiales y el nombre del usuario relacionado (SIN CAMBIOS)
        const { data: solicitudesData, error } = await supabaseClient
            .from('solicitudes')
            .select(`
                *,
                materiales_solicitados (material, cantidad),
                usuarios (nombre, email) 
            `)
            .order('fecha_solicitud', { ascending: false });

        if (error) {
            console.error("Error al cargar datos:", error);
            pendingContainer.innerHTML = "<p>Error cargando solicitudes.</p>";
            deliveredContainer.innerHTML = "<p>Error cargando solicitudes.</p>";
            return;
        }

        // 1. Separar las pendientes (las que no están 'Entregado')
        const pendientes = solicitudesData.filter(s => s.estado !== "Entregado");

        // 2. Separar las entregadas Y que AÚN requieren acción de comentario.
        // 🎯 MODIFICACIÓN CLAVE: Solo muestra si el campo de comentario está vacío o es nulo.
        const entregadas = solicitudesData.filter(s => {
            const isDelivered = s.estado === "Entregado";
            
            // Solo se muestra si el comentario está null, vacío (""), o "N/A".
            const isCommentMissing = !s.comentario_entrega || 
                                     s.comentario_entrega.trim() === '' || 
                                     s.comentario_entrega === 'N/A';
            
            // Si el comentario es "Sin Comentarios", se considera completado y se excluye (ya que !s.comentario_entrega es false)
            return isDelivered && isCommentMissing; 
        });

        // Actualizar dinámicamente el DOM
        updateContainerDynamically(
            pendingContainer,
            pendientes,
            "No hay solicitudes pendientes."
        );

        updateContainerDynamically(
            deliveredContainer,
            entregadas,
            "No hay solicitudes entregadas pendientes de comentario/revisión."
        );
    }

    // 🚀 Ejecutar carga inicial y comenzar el refresco (SIN CAMBIOS)
    loadDashboardData();
    startAutoRefresh();
</script>
</body>
</html>
