<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#12304B">
    <title>Gestor de solicitudes | Pañol</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=2026-10-26m">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js?v=2026-10-26m"></script>
</head>
<body>
<header class="appbar">
    <div class="appbar-inner">
        <a href="menu.html" class="appbar-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Menú</a>
        <div class="appbar-title"><h1>Gestor de solicitudes</h1><p>Pañol Electricidad y Automatización</p></div>
        
    </div>
</header>
<main class="page page-wide main-content gestor">
    <div class="gestor-toolbar">
        <div class="gestor-search">
            <input type="search" id="buscador" placeholder="Buscar por ID, alumno, docente, asignatura o material" oninput="renderizar()" autocomplete="off" aria-label="Buscar solicitudes">
            <kbd class="atajo" title="Atajo de teclado">/</kbd>
        </div>
        <p class="gestor-sync" id="estadoSync" aria-live="polite">Cargando…</p>
        <div class="segmented gestor-tabs" role="tablist" aria-label="Lista">
            <button type="button" class="is-active" data-tab="pendientes" onclick="cambiarPestana('pendientes')">Por entregar <span class="tab-count" id="countPendTab">–</span></button>
            <button type="button" data-tab="entregadas" onclick="cambiarPestana('entregadas')">Sin comentario <span class="tab-count" id="countEntTab">–</span></button>
        </div>
    </div>

    <div class="columns dashboard-container" data-tab-activa="pendientes">
        <section class="column pending-requests" data-tab="pendientes">
            <h2>Por entregar <span class="chip chip-pending num" id="countPend">–</span></h2>
            <div class="column-scroll">
                <div id="pending-container"><p class="muted">Cargando solicitudes…</p></div>
                <button type="button" class="btn-secondary btn-mas" id="masPend" hidden onclick="mostrarMas('pendientes')"></button>
            </div>
        </section>
        <section class="column delivered-requests" data-tab="entregadas">
            <h2>Entregadas sin comentario <span class="chip chip-done num" id="countEnt">–</span></h2>
            <div class="column-scroll">
                <div id="delivered-container"><p class="muted">Cargando solicitudes…</p></div>
                <button type="button" class="btn-secondary btn-mas" id="masEnt" hidden onclick="mostrarMas('entregadas')"></button>
            </div>
        </section>
    </div>
</main>

<div id="commentModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">Comentario de entrega <span class="close-btn" onclick="cerrarFormulario()" role="button" aria-label="Cerrar">×</span></div>
        <p class="muted">Solicitud <strong id="modalSolicitudId" class="num"></strong></p>
        <label for="modalComentario">Comentario</label>
        <textarea id="modalComentario" rows="5" placeholder="Ej: equipo completo, faltó calibrar, etc."></textarea>
        <div class="btn-row">
            <button class="btn-secondary" onclick="cerrarFormulario()">Cancelar</button>
            <button id="btnEnviarComentario">Guardar</button>
        </div>
        <p id="modalMsg" style="margin-top: 12px; text-align: center; font-weight: 600;"></p>
    </div>
</div>
<script>
    // CONFIGURACIÓN DE SUPABASE (SIN CAMBIOS)


    // Contenedores DOM (SIN CAMBIOS)
    const pendingContainer = document.getElementById('pending-container');
    const deliveredContainer = document.getElementById('delivered-container');

    // Variable global para almacenar el ID de la solicitud actual y el ID del intervalo (SIN CAMBIOS)
    let currentSolicitudId = null;
    let intervalId = null;

    // Función auxiliar para formatear fechas (SIN CAMBIOS)
    const formatDate = (dateString) => {
        if (!dateString) return 'N/A';
        const date = fechaSupabase(dateString);
        return date.toLocaleDateString('es-ES');
    };

    // --- LÓGICA DE INTERFAZ DEL MODAL (SIN CAMBIOS) ---

    window.abrirFormulario = (solicitudId) => {
        currentSolicitudId = solicitudId;
        document.getElementById('modalSolicitudId').textContent = 'S-' + solicitudId;
        document.getElementById('modalComentario').value = ''; // Limpiar textarea
        document.getElementById('modalMsg').textContent = ''; // Limpiar mensaje
        document.getElementById('commentModal').style.display = 'flex';
    };

    window.cerrarFormulario = () => {
        document.getElementById('commentModal').style.display = 'none';
    };

    // --- LÓGICA DE ACTUALIZACIÓN DE SUPABASE ---

    // Función para iniciar el refresco automático (SIN CAMBIOS)
    function startAutoRefresh() {
        const intervalTime = 5000;
        if (intervalId) {
            clearInterval(intervalId); // Asegura que solo hay un intervalo corriendo
        }
        intervalId = setInterval(loadDashboardData, intervalTime);
    }
    
    /**
     * Función principal para marcar como Entregado, incluyendo la actualización del Comentario.
     * Se usa para el modal (comentario manual) y el botón "Sin Comentarios".
     */
    async function actualizarComentario(solicitudId, comentario) {
        // Detener el refresco mientras actualizamos
        clearInterval(intervalId);
        document.body.style.cursor = 'wait';

        const isModalUpdate = document.getElementById('commentModal').style.display === 'flex';
        const msgElement = isModalUpdate ? document.getElementById('modalMsg') : null;

        if (msgElement) {
            msgElement.style.color = 'var(--ink)';
            msgElement.textContent = 'Guardando...';
        }

        const { error } = await supabaseClient
            .from('solicitudes')
            .update({
                estado: 'Entregado',
                fecha_entrega: new Date().toISOString(),
                comentario_entrega: comentario // <--- ACTIVA LA ACTUALIZACIÓN DE COMENTARIO
            })
            .eq('id', solicitudId);

        if (error) {
            console.error('Error al guardar comentario:', error);
            if (msgElement) {
                msgElement.style.color = 'var(--danger)';
                msgElement.textContent = '❌ Error al guardar: ' + error.message.substring(0, 50) + '...';
            } else {
                alert('Error al guardar: ' + error.message);
            }
            // Reanudar el refresco incluso con error
            document.body.style.cursor = 'default';
            startAutoRefresh();
            return false;
        }

        if (msgElement) {
            msgElement.style.color = 'var(--done)';
            msgElement.textContent = '✅ Solicitud actualizada con éxito.';
            setTimeout(cerrarFormulario, 1000); // Cerrar modal después de un segundo
        }

        // Recargar datos y reanudar el refresco
        await loadDashboardData();
        document.body.style.cursor = 'default';
        startAutoRefresh();
        return true;
    }


    /**
     * FUNCIÓN SIMPLE: Marcar Entregado de forma simple.
     */
    window.marcarEntregaSimple = async (solicitudId) => {
        // Detener el refresco mientras actualizamos
        clearInterval(intervalId);
        document.body.style.cursor = 'wait';

        const { error } = await supabaseClient
            .from('solicitudes')
            .update({
                estado: 'Entregado', // SOLO ESTADO
                fecha_entrega: new Date().toISOString() // Y FECHA
            })
            .eq('id', solicitudId);

        if (error) {
            console.error('Error al marcar como entregado:', error);
            alert('❌ Error al marcar como entregado: ' + error.message);
        } else {
            console.log(`✅ Solicitud S-${solicitudId} marcada como Entregada.`);
        }

        // Recargar datos y reanudar el refresco
        await loadDashboardData();
        document.body.style.cursor = 'default';
        startAutoRefresh();
        return true;
    };


    // Función al presionar "Enviar y Guardar" dentro del modal (SIN CAMBIOS)
    document.getElementById('btnEnviarComentario').onclick = () => {
        const comentario = document.getElementById('modalComentario').value.trim();
        if (!currentSolicitudId) {
            document.getElementById('modalMsg').style.color = 'var(--danger)';
            document.getElementById('modalMsg').textContent = '⚠️ Error: ID de solicitud no encontrado.';
            return;
        }
        if (!comentario) {
            document.getElementById('modalMsg').style.color = 'var(--pending)';
            document.getElementById('modalMsg').textContent = '⚠️ El comentario no puede estar vacío.';
            return;
        }
        actualizarComentario(currentSolicitudId, comentario);
    };

    // Función al presionar "Sin Comentario" en la tarjeta (guarda el marcador "Sin Comentarios")
    window.guardarSinComentario = async (solicitudId) => {
        if(confirm('¿Desea registrar "Sin Comentarios" para la Solicitud S-' + solicitudId + '?')) {
            // Llama a la función completa de actualización de comentarios
            // Una vez que se guarda "Sin Comentarios", la solicitud desaparecerá del panel.
            await actualizarComentario(solicitudId, "Sin Comentarios"); 
        }
    };
    

    /* ==========================================================
       LISTAS DEL GESTOR
       - Se piden a Supabase solo las solicitudes que se muestran,
         no toda la tabla (antes se traía todo cada 5 segundos).
       - Cada lista muestra 10 tarjetas y crece con "Mostrar más".
       - En computador cada columna tiene su propio desplazamiento;
         en teléfono se cambia de lista con las pestañas.
       - Solo se vuelve a dibujar si los datos cambiaron, así no se
         cierran los detalles abiertos ni salta la pantalla.
    ========================================================== */
    const POR_PAGINA = 10;
    const HORAS_ATRASO = 48;
    const estado = {
        pendientes: { datos: [], total: 0, visibles: POR_PAGINA },
        entregadas: { datos: [], total: 0, visibles: POR_PAGINA }
    };
    const abiertas = new Set();          // tarjetas con materiales desplegados
    let firmaAnterior = '';

    const escapar = (t) => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    function hace(fecha) {
        const d = fechaSupabase(fecha);
        if (!d) return '';
        const min = Math.max(0, Math.round((Date.now() - d) / 60000));
        if (min < 60) return `hace ${min} min`;
        const h = Math.floor(min / 60);
        if (h < 24) return `hace ${h} h`;
        return `hace ${Math.floor(h / 24)} d`;
    }

    const SELECT = `id, estado, docente, asignatura, fecha_solicitud, fecha_entrega, comentario_entrega,
                    materiales_solicitados (material, cantidad), usuarios (nombre, email)`;

    async function cargarPendientes() {
        const { data, error, count } = await supabaseClient
            .from('solicitudes')
            .select(SELECT, { count: 'exact' })
            .neq('estado', 'Entregado')
            .order('fecha_solicitud', { ascending: false })
            .range(0, Math.max(estado.pendientes.visibles, POR_PAGINA) - 1);
        if (error) throw error;
        estado.pendientes.datos = data || [];
        estado.pendientes.total = count ?? (data || []).length;
    }

    async function cargarEntregadas() {
        const { data, error, count } = await supabaseClient
            .from('solicitudes')
            .select(SELECT, { count: 'exact' })
            .eq('estado', 'Entregado')
            .or('comentario_entrega.is.null,comentario_entrega.eq.,comentario_entrega.eq.N/A')
            .order('fecha_entrega', { ascending: false, nullsFirst: false })
            .range(0, Math.max(estado.entregadas.visibles, POR_PAGINA) - 1);
        if (error) throw error;
        estado.entregadas.datos = data || [];
        estado.entregadas.total = count ?? (data || []).length;
    }

    async function loadDashboardData() {
        try {
            await Promise.all([cargarPendientes(), cargarEntregadas()]);
        } catch (error) {
            console.error('Error al cargar datos:', error);
            const sync = document.getElementById('estadoSync');
            sync.textContent = 'Sin conexión, reintentando…';
            sync.classList.add('is-error');
            if (!firmaAnterior) {
                pendingContainer.innerHTML = '<p class="empty-state">No se pudieron cargar las solicitudes.</p>';
                deliveredContainer.innerHTML = '<p class="empty-state">No se pudieron cargar las solicitudes.</p>';
            }
            return;
        }
        document.getElementById('estadoSync').textContent =
            'Actualizado ' + new Date().toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' });
        document.getElementById('estadoSync').classList.remove('is-error');
        const firma = JSON.stringify([estado.pendientes, estado.entregadas]);
        if (firma === firmaAnterior) { actualizarTiempos(); return; }
        firmaAnterior = firma;
        renderizar();
    }

    function coincide(s, q) {
        if (!q) return true;
        const texto = [s.id, 'S-' + s.id, s.usuarios?.nombre, s.usuarios?.email, s.docente, s.asignatura,
            ...(s.materiales_solicitados || []).map(m => m.material)].join(' ').toLowerCase();
        return q.split(/\s+/).every(p => texto.includes(p));
    }

    function tarjeta(s, tipo) {
        const materiales = s.materiales_solicitados || [];
        const nombre = escapar(s.usuarios?.nombre || s.usuarios?.email || 'Desconocido');
        const pendiente = tipo === 'pendientes';
        const fechaRef = pendiente ? s.fecha_solicitud : s.fecha_entrega;
        const horas = (Date.now() - fechaSupabase(s.fecha_solicitud)) / 36e5;
        const atrasada = pendiente && horas > HORAS_ATRASO;
        const abierta = pendiente || abiertas.has(s.id);
        const lista = materiales.length
            ? materiales.map(m => `<li><span>${escapar(m.material)}</span><span class="num">× ${escapar(m.cantidad)}</span></li>`).join('')
            : '<li class="muted">Sin materiales registrados.</li>';
        return `
        <article class="request-card${atrasada ? ' is-late' : ''}" data-solicitud-id="${s.id}">
            <div class="rc-top">
                <strong class="num">S-${s.id}</strong>
                <span class="rc-time" data-fecha="${escapar(fechaRef || '')}">${pendiente ? '' : 'entregada '}${hace(fechaRef)}</span>
                ${atrasada ? '<span class="chip chip-pending">Atrasada</span>' : ''}
            </div>
            <p class="rc-user">${nombre}</p>
            <p class="rc-meta">${escapar(s.docente)}<br>${escapar(s.asignatura)}</p>
            <details class="rc-materiales" ${abierta ? 'open' : ''} ontoggle="recordarAbierta(${s.id}, this.open)">
                <summary>${materiales.length} ${materiales.length === 1 ? 'material' : 'materiales'}</summary>
                <ul>${lista}</ul>
            </details>
            <div class="actions">
                ${pendiente
                    ? `<button class="btn-success" onclick="marcarEntregaSimple(${s.id})">Marcar como entregado</button>`
                    : `<button class="btn-comment" onclick="abrirFormulario(${s.id})">Comentar</button>
                       <button class="btn-no-comment btn-secondary" onclick="guardarSinComentario(${s.id})">Sin comentario</button>`}
            </div>
        </article>`;
    }

    function renderLista(tipo, contenedor, botonMas, vacio) {
        const q = document.getElementById('buscador').value.trim().toLowerCase();
        const st = estado[tipo];
        const filtradas = st.datos.filter(s => coincide(s, q));
        contenedor.innerHTML = filtradas.length
            ? filtradas.map(s => tarjeta(s, tipo)).join('')
            : `<p class="empty-state">${q ? 'Ninguna solicitud coincide con la búsqueda.' : vacio}</p>`;
        const faltan = st.total - st.datos.length;
        botonMas.hidden = faltan <= 0;
        botonMas.textContent = `Mostrar ${Math.min(POR_PAGINA, faltan)} más (quedan ${faltan.toLocaleString('es-CL')})`;
    }

    function renderizar() {
        renderLista('pendientes', pendingContainer, document.getElementById('masPend'), 'No hay solicitudes por entregar.');
        renderLista('entregadas', deliveredContainer, document.getElementById('masEnt'), 'No hay entregas pendientes de comentario.');
        const fmt = n => Number(n).toLocaleString('es-CL');
        ['countPend', 'countPendTab'].forEach(id => document.getElementById(id).textContent = fmt(estado.pendientes.total));
        ['countEnt', 'countEntTab'].forEach(id => document.getElementById(id).textContent = fmt(estado.entregadas.total));
    }

    // Actualiza los "hace X min" sin volver a dibujar las tarjetas
    function actualizarTiempos() {
        document.querySelectorAll('.rc-time[data-fecha]').forEach(el => {
            const prefijo = el.closest('.delivered-requests') ? 'entregada ' : '';
            el.textContent = prefijo + hace(el.dataset.fecha);
        });
    }

    window.recordarAbierta = (id, abierta) => { abierta ? abiertas.add(id) : abiertas.delete(id); };

    window.mostrarMas = async (tipo) => {
        estado[tipo].visibles += POR_PAGINA;
        const boton = document.getElementById(tipo === 'pendientes' ? 'masPend' : 'masEnt');
        boton.disabled = true;
        try { await (tipo === 'pendientes' ? cargarPendientes() : cargarEntregadas()); }
        catch (e) { console.error(e); }
        boton.disabled = false;
        firmaAnterior = JSON.stringify([estado.pendientes, estado.entregadas]);
        renderizar();
    };

    window.cambiarPestana = (tab) => {
        document.querySelector('.dashboard-container').dataset.tabActiva = tab;
        document.querySelectorAll('.gestor-tabs [data-tab]').forEach(b => b.classList.toggle('is-active', b.dataset.tab === tab));
    };
    window.renderizar = renderizar;

    // Atajos de teclado (computador): "/" busca, "Esc" limpia la búsqueda o cierra el comentario
    document.addEventListener('keydown', (e) => {
        const buscador = document.getElementById('buscador');
        const escribiendo = ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName);
        if (e.key === '/' && !escribiendo) { e.preventDefault(); buscador.focus(); buscador.select(); }
        if (e.key === 'Escape') {
            if (document.getElementById('commentModal').style.display === 'flex') cerrarFormulario();
            else if (document.activeElement === buscador && buscador.value) { buscador.value = ''; renderizar(); }
        }
    });

    // 🚀 Carga inicial y refresco automático cada 5 segundos
    loadDashboardData();
    startAutoRefresh();
</script>
</body>
</html>
