<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#12304B">
    <title>Mi historial | Pañol</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=2026-10-26d">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js?v=2026-10-26d"></script>
</head>
<body>
<header class="appbar">
    <div class="appbar-inner">
        <a href="menu.html" class="appbar-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Menú</a>
        <div class="appbar-title"><h1>Mi historial</h1><p>Pañol Electricidad y Automatización</p></div>
        
    </div>
</header>
<main class="page container">
    <div class="filter-box">
        <div class="filter-field"><label for="desde">Desde</label><input type="date" id="desde"></div>
        <div class="filter-field"><label for="hasta">Hasta</label><input type="date" id="hasta"></div>
        <button id="btn-buscar">Filtrar</button>
    </div>
    <div id="cards-historial" class="card-list"></div>
    <div id="sin-datos" class="empty-state mensaje-vacio" style="display:none">
        Aún no tienes solicitudes entregadas en este periodo.
    </div>
</main>

<div class="modal" id="modal-materiales">
    <div class="modal-content">
        <div class="modal-header">Materiales solicitados <span class="close-btn" onclick="cerrarModal()" role="button" aria-label="Cerrar">×</span></div>
        <div class="table-wrap">
            <table>
                <thead><tr><th>Material</th><th>Cantidad</th></tr></thead>
                <tbody id="modal-body-materiales"></tbody>
            </table>
        </div>
    </div>
</div>
<script>
/* ---------------------- CLIENTE SUPABASE ---------------------- */


let usuario = null;

document.addEventListener("DOMContentLoaded", async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();

    if (!session) {
        alert("Debes iniciar sesión.");
        window.location.href = "index.html";
        return;
    }

    usuario = session.user.email;
    cargarHistorial();
});

/* ---------------------- CARGAR HISTORIAL EN CARDS ---------------------- */
async function cargarHistorial() {
    const { data: solicitudes } = await supabaseClient
        .from('solicitudes')
        .select('*')
        .eq('email', usuario)
        .eq('estado', 'Entregado')
        .order('fecha_entrega', { ascending: false });

    const contenedor = document.getElementById("cards-historial");
    const sinDatos = document.getElementById("sin-datos");

    contenedor.innerHTML = "";

    if (!solicitudes || solicitudes.length === 0) {
        sinDatos.style.display = "block";
        return;
    }
    sinDatos.style.display = "none";

    const solicitudesConMateriales = await Promise.all(
        solicitudes.map(async (s) => {
            const { data: materiales } = await supabaseClient
                .from('materiales_solicitados')
                .select('*')
                .eq('id_solicitud', s.id);

            return { ...s, materiales };
        })
    );

    solicitudesConMateriales.forEach(s => {
        const materialesJson = encodeURIComponent(JSON.stringify(s.materiales));

        const card = document.createElement("div");
        card.classList.add("card");

        card.innerHTML = `
            <h3 class="num">Solicitud #${s.id} <span class="chip chip-done">Entregada</span></h3>
            <p><strong>Docente:</strong> ${s.docente}</p>
            <p><strong>Asignatura:</strong> ${s.asignatura}</p>
            <p><strong>Fecha Solicitud:</strong> ${new Date(s.fecha_solicitud).toLocaleDateString()}</p>
            <p><strong>Fecha Entrega:</strong> ${new Date(s.fecha_entrega).toLocaleDateString()}</p>

            <div class="acciones">
                <button class="btn-secondary btn-materiales" onclick='verMaterialesJSON("${materialesJson}")'>Ver materiales</button>
                <button class="btn-repetir" onclick='repetirSolicitud(${s.id})'>Repetir</button>
            </div>
        `;

        contenedor.appendChild(card);
    });
}

/* ------------------ MODAL MATERIALES ------------------ */
function verMaterialesJSON(json) {
    const materiales = JSON.parse(decodeURIComponent(json));
    const tbody = document.getElementById("modal-body-materiales");
    tbody.innerHTML = "";

    materiales.forEach(m => {
        tbody.innerHTML += `<tr><td>${m.material}</td><td>${m.cantidad}</td></tr>`;
    });

    document.getElementById("modal-materiales").style.display = "flex";
}

function cerrarModal() {
    document.getElementById("modal-materiales").style.display = "none";
}

/* ------------------ REPETIR SOLICITUD ------------------ */
async function repetirSolicitud(id_solicitud) {

    const { data: materiales } = await supabaseClient
        .from('materiales_solicitados')
        .select('*')
        .eq('id_solicitud', id_solicitud);

    const { data: solicitudOriginal } = await supabaseClient
        .from('solicitudes')
        .select('docente, asignatura')
        .eq('id', id_solicitud)
        .single();

    const params = new URLSearchParams({
        docente: solicitudOriginal.docente,
        asignatura: solicitudOriginal.asignatura,
        materiales: JSON.stringify(materiales.map(m => m.material)),
        cantidades: JSON.stringify(materiales.map(m => m.cantidad))
    });

    window.location.href = `solicitar.html?${params.toString()}`;
}

/* ------------------ FILTRO FECHAS ------------------ */
document.getElementById("btn-buscar").addEventListener("click", async () => {
    const desde = document.getElementById("desde").value;
    const hasta = document.getElementById("hasta").value;

    let query = supabaseClient
        .from('solicitudes')
        .select('*')
        .eq('email', usuario)
        .eq('estado', 'Entregado');

    if (desde) query = query.gte('fecha_entrega', desde);
    if (hasta) query = query.lte('fecha_entrega', hasta + "T23:59:59.999Z");

    const { data } = await query.order('fecha_entrega', { ascending: false });

    const contenedor = document.getElementById("cards-historial");
    const sinDatos = document.getElementById("sin-datos");
    contenedor.innerHTML = "";

    if (!data || data.length === 0) {
        sinDatos.style.display = "block";
        return;
    }
    sinDatos.style.display = "none";

    const dataConMateriales = await Promise.all(
        data.map(async (s) => {
            const { data: materiales } = await supabaseClient
                .from('materiales_solicitados')
                .select('*')
                .eq('id_solicitud', s.id);
            return { ...s, materiales };
        })
    );

    dataConMateriales.forEach(s => {
        const materialesJson = encodeURIComponent(JSON.stringify(s.materiales));

        const card = document.createElement("div");
        card.classList.add("card");

        card.innerHTML = `
            <h3 class="num">Solicitud #${s.id} <span class="chip chip-done">Entregada</span></h3>
            <p><strong>Docente:</strong> ${s.docente}</p>
            <p><strong>Asignatura:</strong> ${s.asignatura}</p>
            <p><strong>Fecha Solicitud:</strong> ${new Date(s.fecha_solicitud).toLocaleDateString()}</p>
            <p><strong>Fecha Entrega:</strong> ${new Date(s.fecha_entrega).toLocaleDateString()}</p>

            <div class="acciones">
                <button class="btn-secondary btn-materiales" onclick='verMaterialesJSON("${materialesJson}")'>Ver materiales</button>
                <button class="btn-repetir" onclick='repetirSolicitud(${s.id})'>Repetir</button>
            </div>
        `;

        contenedor.appendChild(card);
    });
});
</script>
</body>
</html>
