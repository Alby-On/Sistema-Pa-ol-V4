<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#12304B">
    <title>Menú | Pañol</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">

</head>
<body>
<header class="appbar">
    <div class="appbar-inner">
        
        <div class="appbar-title"><h1>Sistema de Pañol</h1><p>Pañol Electricidad y Automatización</p></div>
        <button class="btn-sm btn-text logout appbar-logout" onclick="logout()">Cerrar sesión</button>
    </div>
</header>
<main class="page">
    <div class="page-intro">
        <h2 id="welcomeMsg" class="welcome"></h2>
        <p>¿Qué necesitas hacer hoy?</p>
    </div>

    <div class="menu-list">
        <button onclick="location.href='solicitar.html'"><span class="item-title">Solicitar materiales</span><span class="item-desc">Pide herramientas e insumos para tu clase</span></button>
        <button onclick="location.href='entregar.html'"><span class="item-title">Entregar materiales</span><span class="item-desc">Completa la entrega de tus solicitudes pendientes</span></button>
        <button onclick="location.href='historial.html'"><span class="item-title">Mi historial</span><span class="item-desc">Revisa y repite solicitudes anteriores</span></button>
    </div>

    <div class="menu-group" id="adminGroup" hidden>
        <h3>Administración</h3>
        <div class="menu-list">
            <button id="admin_panel_Button" onclick="location.href='panel_admin.html'"><span class="item-title">Gestor de solicitudes</span><span class="item-desc">Entregas pendientes y comentarios</span></button>
            <button id="admin_estadisticas_Button" onclick="location.href='panel_estadisticas.html'"><span class="item-title">Estadísticas</span><span class="item-desc">Uso del pañol por docente, carrera y material</span></button>
            <button id="admin_historial_Button" onclick="location.href='historial_admin.html'"><span class="item-title">Histórico de solicitudes</span><span class="item-desc">Busca solicitudes entregadas por RUT o fecha</span></button>
        </div>
    </div>

    <div class="menu-group">
        <h3>Mi perfil</h3>
        <div class="panel">
            <dl class="profile">
                <dt>Nombre</dt><dd id="pNombre"></dd>
                <dt>RUT</dt><dd id="pRut" class="num"></dd>
                <dt>Carrera</dt><dd id="pCarrera"></dd>
                <dt>Teléfono</dt><dd id="pTelefono" class="num"></dd>
                <dt>Correo</dt><dd id="pCorreo"></dd>
            </dl>
        </div>
    </div>
</main>
<script type="module">
/* ---------------------- SESIÓN ACTIVA ---------------------- */
const user = JSON.parse(localStorage.getItem("currentUser"));

if (!user) {
    window.location.href = "index.html";
}

/* ---------------------- DATOS EN PANTALLA ---------------------- */
document.getElementById("welcomeMsg").textContent = `Hola, ${user.nombre.split(' ')[0]}`; // Mostrar solo el primer nombre
document.getElementById("pNombre").textContent   = user.nombre;
document.getElementById("pRut").textContent      = user.rut;
document.getElementById("pCarrera").textContent  = user.carrera;
document.getElementById("pTelefono").textContent = user.telefono;
document.getElementById("pCorreo").textContent   = user.email;

/* ---------------------- CERRAR SESIÓN ---------------------- */
function logout() {
    localStorage.removeItem("currentUser");
    window.location.href = "index.html";
}

/* ---- Necesario para que el botón funcione ---- */
window.logout = logout;

// Mostrar la sección de administración solo a administradores
if (user.rol === "admin") {
    document.getElementById("adminGroup").hidden = false;
}
</script>
</body>
</html>
